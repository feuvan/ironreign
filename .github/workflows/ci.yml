name: CI

# Engine-independent checks: the rules engine (Source/IronReign/Sim) and the game data.
# The Unreal Engine build itself is done locally.

on:
  push:
    branches: [main, "claude/**"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  rules-engine:
    name: Rules engine tests (${{ matrix.compiler }})
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        compiler: [gcc, clang]
    steps:
      - uses: actions/checkout@v4

      - name: Install Ninja
        run: sudo apt-get update && sudo apt-get install -y ninja-build

      - name: Configure
        run: |
          if [ "${{ matrix.compiler }}" = "clang" ]; then CXX=clang++; else CXX=g++; fi
          cmake -S Tests -B build -G Ninja -DCMAKE_CXX_COMPILER="$CXX" -DCMAKE_BUILD_TYPE=RelWithDebInfo

      - name: Build (includes a unity-build check of Source/IronReign/Sim)
        run: cmake --build build

      - name: Test (unit tests + headless AI campaign)
        run: ctest --test-dir build --output-on-failure

  data:
    name: Scenario and localization checks
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Validate scenarios
        run: python3 Tools/validate_scenario.py

      - name: Check string tables
        # --warn-missing: untranslated keys are warnings while the zh-Hans/zh-Hant/ja/ko pass is in progress;
        # placeholder mismatches and stale English tables still fail. Drop the flag once translations are complete.
        run: python3 Tools/Localization/check_localization.py --warn-missing
