[/Script/EngineSettings.GameMapsSettings]
; The game is pure Slate: the engine's empty Entry map is enough (world rendering is disabled at runtime).
GameDefaultMap=/Engine/Maps/Entry
EditorStartupMap=/Engine/Maps/Entry
GlobalDefaultGameMode=/Script/IronReign.IronReignGameMode

[/Script/Engine.Engine]
+ActiveGameNameRedirects=(OldGameName="TP_Blank",NewGameName="IronReign")

[/Script/Engine.RendererSettings]
; Real-time 3D presentation (DESIGN.md section 12): fully dynamic lighting, no baked lighting anywhere.
; Lumen global illumination (1) and reflections (1), software tracing against mesh distance fields.
r.DynamicGlobalIlluminationMethod=1
r.ReflectionMethod=1
r.GenerateMeshDistanceFields=True
r.Lumen.TraceMeshSDFs=1
; Virtual Shadow Maps for the sun (Nanite meshes cache their shadow pages).
r.Shadow.Virtual.Enable=1
; Temporal Super Resolution.
r.AntiAliasingMethod=4
; Exposure is set explicitly by the post-process (fixed manual exposure per season look).
r.DefaultFeature.AutoExposure=False
; Camera pans over the map must stay crisp.
r.DefaultFeature.MotionBlur=False
r.VolumetricFog=1
r.SkyAtmosphere=1
r.SupportSkyAtmosphereAffectsHeightFog=True
r.Nanite.ProjectEnabled=True
r.AllowStaticLighting=False
; Custom depth with stencil (selection outlines).
r.CustomDepth=3

[/Script/MacTargetPlatform.MacTargetSettings]
; Nanite, Lumen and Virtual Shadow Maps need the SM6 Metal feature level (Apple silicon, macOS 14+). The Metal shader
; standard (MaxShaderLanguageVersion) stays at the engine default; raise it in Project Settings > Platforms > Mac only
; if the editor reports that SM6 needs a newer Metal standard.
-TargetedRHIs=SF_METAL_SM5
+TargetedRHIs=SF_METAL_SM6
